theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式

# 插件配置
plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\-\.]+'
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      locale: zh
  - tags
  - redirects:
      redirect_maps:
        '找对象/朋友记录与评估.md': '社交/朋友记录与评估.md'
  - blog:
      blog_dir: blog
      archive: true
      archive_name: 归档
      categories: true
      categories_name: 分类
      authors: true
      pagination: true
      pagination_per_page: 10
      post_readtime: true
      post_readtime_words_per_minute: 200
      authors_file: "{blog}/.authors.yml"
  - minify:
      minify_html: true

# Markdown扩展
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html

# 额外配置
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Minkelxy/MinkeWiki
      name: GitHub仓库
  analytics:
    feedback:
      title: 此页面是否有帮助？
      ratings:
        - icon: material/thumb-up-outline
          name: 有帮助
          data: 1
          note: 感谢您的反馈！
        - icon: material/thumb-down-outline
          name: 没有帮助
          data: 0
          note: 感谢您的反馈，我们会继续改进！

# 仓库配置
repo_name: 'Minkelxy/MinkeWiki'
repo_url: 'https://github.com/Minkelxy/MinkeWiki'

# 网站配置
site_url: 'https://minkelxy.github.io/MinkeWiki/'
